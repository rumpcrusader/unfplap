name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.2
          use-dotnet: false

      - name: Fetch anatomy assets
        if: github.event_name != 'pull_request'
        run: |
          source scripts/anatomy_assets.sh
          if [ -z "${ANATOMY_ARCHIVE_URL}" ]; then
            echo "ANATOMY_ARCHIVE_URL is empty in scripts/anatomy_assets.sh; run scripts/pack_anatomy.sh --upload." >&2
            exit 1
          fi
          curl --fail --silent --show-error --location --retry 3 \
            --output "$RUNNER_TEMP/anatomy.zip" "$ANATOMY_ARCHIVE_URL"

      - name: Check tag matches mod.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(python3 -c 'import json;print(json.load(open("mod.json"))["version"])')"
          test "$tag" = "$ver" || { echo "tag $tag != mod.json version $ver"; exit 1; }

      - name: Extract release changelog
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 - "$GITHUB_REF_NAME" <<'PY'
          import pathlib
          import sys

          tag = sys.argv[1]
          lines = pathlib.Path("changelog.txt").read_text(encoding="utf-8").splitlines()
          out = []
          inside = False
          for line in lines:
              stripped = line.strip()
              if stripped == tag:
                  inside = True
                  continue
              if inside and stripped.startswith("v") and stripped[1:2].isdigit():
                  break
              if inside:
                  out.append(line)
          body = "\n".join(out).strip()
          if not body:
              raise SystemExit(f"changelog.txt has no section for {tag}")
          pathlib.Path("release_notes.md").write_text(body + "\n", encoding="utf-8")
          PY

      # A tag build always takes the archive; only a pull request may build without the anatomy,
      # so a release can never ship the code-only pack by accident.
      - name: Build
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            ./build.sh --anatomy-zip "$RUNNER_TEMP/anatomy.zip"
          else
            ./build.sh --no-anatomy
          fi

      - name: Assert anatomy is in the pack
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 - <<'PY'
          import glob
          import pathlib
          import sys

          pcks = glob.glob("dist/*.pck")
          if len(pcks) != 1:
              raise SystemExit(f"expected one pack, found {pcks}")
          blob = pathlib.Path(pcks[0]).read_bytes()
          if not blob.startswith(b"GDPC"):
              raise SystemExit(f"{pcks[0]} is not a Godot pack")
          source = pathlib.Path("scripts/anatomy_assets.sh").read_text(encoding="utf-8")
          names = source.split("ANATOMY_FILES=(")[1].split(")")[0].split()
          missing = [name for name in names if f"assets/anatomy/{name}".encode() not in blob]
          if missing:
              raise SystemExit(f"{pcks[0]} is missing anatomy: {' '.join(missing)}")
          print(f"ANATOMY_PACKED ok {len(names)}/{len(names)} in {pcks[0]} ({len(blob)} bytes)")
          PY

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.pck
          body_path: release_notes.md
