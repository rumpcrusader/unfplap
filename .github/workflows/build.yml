name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.2
          use-dotnet: false

      - name: Fetch master for release checks
        if: startsWith(github.ref, 'refs/tags/v')
        run: git fetch --no-tags origin master:refs/remotes/origin/master

      - name: Check release metadata
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          NOTES: ${{ runner.temp }}/release_notes.md
        run: scripts/check_release.sh --ci --tag "$GITHUB_REF_NAME" --notes-out "$NOTES"

      - name: Fetch anatomy assets
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          source scripts/anatomy_assets.sh
          if [ -z "${ANATOMY_ARCHIVE_URL}" ]; then
            echo "ANATOMY_ARCHIVE_URL is empty in scripts/anatomy_assets.sh; run scripts/pack_anatomy.sh --upload." >&2
            exit 1
          fi
          curl --fail --silent --show-error --location --retry 3 \
            --output "$RUNNER_TEMP/anatomy.zip" "$ANATOMY_ARCHIVE_URL"

      # A tag build always takes the archive; every other build is code-only. The packer verifies
      # the anatomy set itself, so a release cannot fall back to the code-only pack.
      - name: Build
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            ./build.sh --anatomy-zip "$RUNNER_TEMP/anatomy.zip"
          else
            ./build.sh --no-anatomy
          fi

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.pck
            dist/*.pck.sha256
          body_path: ${{ runner.temp }}/release_notes.md
