name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.2
          use-dotnet: false

      - name: Fetch default branch for release checks
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: git fetch --no-tags origin "$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"

      - name: Check release metadata
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          NOTES: ${{ runner.temp }}/release_notes.md
        run: scripts/check_release.sh --ci --tag "$GITHUB_REF_NAME" --branch "$DEFAULT_BRANCH" --notes-out "$NOTES"

      # The packer verifies the full tracked runtime tree, including the committed anatomy assets.
      - name: Build
        run: ./build.sh

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.pck
            dist/*.pck.sha256
          body_path: ${{ runner.temp }}/release_notes.md
