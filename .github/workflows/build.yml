name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  source-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install gdtoolkit
        run: python3 -m pip install -r scripts/requirements-lint.txt
      - name: Static gate
        run: scripts/check.sh --static
      - name: Lint shipped GDScript
        run: scripts/lint.sh
      - name: Pack report self-test
        run: python3 scripts/pack_report.py --self-test

  build:
    needs: source-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # checkout re-fetches a tag push as a lightweight ref for its commit when
      # fetch-depth is 0, so the release check must read the tag object again.
      - name: Restore the annotated tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.2
          use-dotnet: false

      - name: Fetch default branch for release checks
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: git fetch --no-tags origin "$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"

      - name: Check release metadata
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          NOTES: ${{ runner.temp }}/release_notes.md
        run: scripts/check_release.sh --ci --tag "$GITHUB_REF_NAME" --branch "$DEFAULT_BRANCH" --notes-out "$NOTES"

      - name: Fetch resource assets
        run: scripts/fetch_assets.sh

      - name: Parse and static gate
        run: scripts/check.sh --all

      # The packer verifies the full tracked tree plus the fetched resource runtime.
      - name: Build
        run: ./build.sh

      - name: Pack report
        run: |
          pck="$(ls -1 dist/*.pck)"
          python3 scripts/pack_report.py --pck "$pck" --format markdown \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.pck
            dist/*.pck.sha256
          body_path: ${{ runner.temp }}/release_notes.md
