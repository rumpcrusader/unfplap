name: publish-index

# Publishes a release to the self-hosted Home: Equestria mod index.
# A dry run stops after the preview, so the first submission is always reviewed by eye.
# The submit job needs the `mod-index` environment with required reviewers; approving the run
# lets it spend HE_MOD_TOKEN. The index reviewer still approves the release revision itself.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (empty uses the latest release)
        required: false
        default: ""
      dry_run:
        description: Preview only, do not write to the index
        type: boolean
        default: true
      force:
        description: Submit even when the listing has this version or a newer one
        type: boolean
        default: false
      create:
        description: Create the listing (first run only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-index
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
      version: ${{ steps.publish.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Preview the submission
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          args=()
          if [ -n "$TAG" ]; then args+=(--tag "$TAG"); fi
          python3 scripts/publish_index.py "${args[@]}"

  submit:
    needs: preview
    if: github.event.inputs.dry_run == 'false'
    runs-on: ubuntu-latest
    environment:
      name: mod-index
      url: https://mods.pones.top/
    steps:
      - uses: actions/checkout@v4

      - name: Submit to the mod index
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          HE_MOD_TOKEN: ${{ secrets.HE_MOD_TOKEN }}
          TAG: ${{ needs.preview.outputs.tag }}
          FORCE: ${{ github.event.inputs.force }}
          CREATE: ${{ github.event.inputs.create }}
        run: |
          if [ -z "$TAG" ]; then
            echo "preview did not return a release tag" >&2
            exit 1
          fi
          args=(--submit --tag "$TAG")
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          if [ "$CREATE" = "true" ]; then args+=(--create); fi
          python3 scripts/publish_index.py "${args[@]}"
