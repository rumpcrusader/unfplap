name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.2
          use-dotnet: false

      - name: Check tag matches mod.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(python3 -c 'import json;print(json.load(open("mod.json"))["version"])')"
          test "$tag" = "$ver" || { echo "tag $tag != mod.json version $ver"; exit 1; }

      - name: Build
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            ./build.sh --no-extends
          else
            ./build.sh
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: unfplap-pck
          path: dist/*.pck
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.pck
          generate_release_notes: true
