name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.2
          use-dotnet: false

      - name: Fetch anatomy assets
        if: github.event_name != 'pull_request'
        env:
          ANATOMY_URL: ${{ vars.ANATOMY_URL }}
        run: |
          if [ -z "$ANATOMY_URL" ]; then
            echo "Repository variable ANATOMY_URL is not set; it must point at the anatomy zip." >&2
            exit 1
          fi
          echo "::add-mask::$ANATOMY_URL"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$RUNNER_TEMP/anatomy.zip" "$ANATOMY_URL"

      - name: Check tag matches mod.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(python3 -c 'import json;print(json.load(open("mod.json"))["version"])')"
          test "$tag" = "$ver" || { echo "tag $tag != mod.json version $ver"; exit 1; }

      - name: Extract release changelog
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 - "$GITHUB_REF_NAME" <<'PY'
          import pathlib
          import sys

          tag = sys.argv[1]
          lines = pathlib.Path("changelog.txt").read_text(encoding="utf-8").splitlines()
          out = []
          inside = False
          for line in lines:
              stripped = line.strip()
              if stripped == tag:
                  inside = True
                  continue
              if inside and stripped.startswith("v") and stripped[1:2].isdigit():
                  break
              if inside:
                  out.append(line)
          body = "\n".join(out).strip()
          if not body:
              raise SystemExit(f"changelog.txt has no section for {tag}")
          pathlib.Path("release_notes.md").write_text(body + "\n", encoding="utf-8")
          PY

      - name: Build
        run: |
          if [ -f "$RUNNER_TEMP/anatomy.zip" ]; then
            ./build.sh --anatomy-zip "$RUNNER_TEMP/anatomy.zip"
          else
            ./build.sh --no-anatomy
          fi

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.pck
          body_path: release_notes.md
